[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "skill-harness"
version = "0.2.3"
description = "I wanted to know if you could tell if a skill was any good. This runs the same task with the skill and without it, and reports what can honestly be said about the difference - often \"not enough to call it\". A missing figure is a typed refusal, never an invented score. First-class Claude Code support."
readme = "README.md"
keywords = [
  "claude-code",
  "agent-skills",
  "skill-evaluation",
  "llm-evaluation",
  "eval-harness",
  "ai-agents",
  "prompt-evaluation",
  "evals",
  "ab-testing",
]
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MrBinnacle" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  # anthropic >=1.2.0 enforces post-patch for GHSA-q5f5-3gjm-7mfm + GHSA-w828-4qhx-vxx3
  # (Memory Tool CVEs, 2026-03-31; patched in 0.87.0). Memory Tool surface is not used.
  "anthropic>=1.2.0",
  # T3 tracer adapter; supply-chain audit at docs/supply-chain/openai-audit-2026-06-08.md.
  # Capped <3 (S4): the audit anchored 2.41.0 as known-good but never reviewed
  # a 3.x major; an open-ended lower bound would let a future 3.x resolve here
  # unaudited, which is exactly the drift the audit's own floor was meant to
  # anchor against. Re-audit before raising this cap.
  "openai>=2.41,<4",
  "click>=8.1",
  "pydantic>=2.6",
  # rich is solo-maintainer (willmcgugan / Textualize). Use for terminal output only.
  "rich>=13.7",
  # scipy>=1.11: EB-MoM hierarchical fit + BH-FDR fallback (A53, Track E.2).
  # Already present transitively via statsmodels; direct pin per Phase 1.1 supply-chain audit.
  "scipy>=1.11",
  # tiktoken: offline tokenizer for Verbosity metric (A35). Version-pinned to cl100k_base
  # encoding which is stable across 0.x series; DO NOT upgrade without re-running
  # bit-equality corpus and updating IMPLEMENTATION_HASH in verbosity.py.
  # RUNTIME dep (imported by oracles/tier1/verbosity.py) — was mis-filed under dev
  # extras, which broke every non-dev install at the first Tier-1 code path.
  "tiktoken>=0.7,<1.0",
  # statsmodels: OLS for AlpacaEval-2 length regression (A35 observation-time half).
  # RUNTIME dep (imported by calibration/length_regression.py) — same dev-extras mis-file.
  "statsmodels>=0.14",
]

[project.optional-dependencies]
# Agentic subject layer (v0.2): Inspect runs the sandboxed Claude Code subject;
# skill-harness keeps pairing/admissibility/evidence. Opt-in — the core package
# (audit, evidence store, aggregation) has no agent-execution surface without it.
# Supply-chain note: docs/supply-chain/inspect-audit-2026-07-09.md.
inspect = [
  "inspect-ai>=0.3.245",
  "inspect-swe>=0.2.65",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-xdist>=3.5",
  "ruff>=0.5",
  "mypy>=2.3.1",
  "hypothesis>=6.100",
  # C.1 — Tier-1 mechanical-validity gate (A33)
  # pytest-socket blocks network calls in offline Tier-1 tests; module-level autouse fixture.
  "pytest-socket>=0.8.1",
  # CONTRIBUTING.md's setup says `pre-commit install` right after `pip install -e ".[dev]"`;
  # ship the tool that command needs.
  "pre-commit>=4",
  # #161 — test-time numerical-reference + hygiene surface (assurance-pass manifest).
  # scipy/statsmodels already runtime deps; re-declared here so `pip install -e ".[dev]"`
  # alone still lands the full test stack. numpy is the explicit numerical base.
  # pytest-randomly drives randomized CI order; its printed seed reproduces failures.
  "scipy>=1.11",
  "statsmodels>=0.14",
  "numpy>=2.0",
  "pytest-randomly>=4.1",
  # #182 — SERS conformance harness (draft 2020-12 validator).
  # Owner-approved 2026-08-09; python-jsonschema org reference implementation.
  "jsonschema>=4.26.0",
]

[project.scripts]
skill-harness = "skill_harness.cli.main:cli"

[project.urls]
Homepage = "https://github.com/MrBinnacle/skill-harness"
Repository = "https://github.com/MrBinnacle/skill-harness"
Issues = "https://github.com/MrBinnacle/skill-harness/issues"
Changelog = "https://github.com/MrBinnacle/skill-harness/blob/main/CHANGELOG.md"
Documentation = "https://github.com/MrBinnacle/skill-harness/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_harness"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "slow: long-running tests (deselect with -m 'not slow')",
  "live: hits the live Anthropic API (deselect with -m 'not live', as CI does)",
  # C.1 A33 — no_network: Tier-1 mechanical tests run offline (pytest-socket enforced).
  # Autouse fixture in tests/oracles/tier1/conftest.py covers ALL tests in that package.
  # PYTHONHASHSEED=0 REQUIRED for Tier-1 bit-equality discipline (A33).
  # Run Tier-1 tests with: PYTHONHASHSEED=0 pytest tests/oracles/tier1/
  # If PYTHONHASHSEED is not set, tests/oracles/tier1/conftest.py raises AssertionError.
  "no_network: test must run fully offline (pytest-socket blocks sockets)",
  # #187 dense CS coverage grid — own CI job (do not fold into the 15m matrix cell).
  "calibration: dense sequential coverage calibration (deselect with -m 'not calibration')",
  # #168 assurance lane — deep stateful/fuzz runs. Own CI job with its own timeout;
  # do not fold into the 25m test matrix cell (#170 alone specifies >=1h of fuzz).
  "assurance: long-running assurance search (deselect with -m 'not assurance')",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["fuzz/corpus", "fuzz/crashes", "fuzz/artifacts"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "UP",            # pyupgrade
  "B",             # bugbear
  "PL",            # pylint
  "SIM",           # simplify
  "RUF",           # ruff-specific
  "S",             # bandit (security)
]
ignore = [
  "S101",  # assert is fine in tests
  "PLC0415",  # Local imports deliberately isolate optional deps and test seams.
  "PLR0911",  # Explicit early returns keep validation and dispatch readable.
  "PLR0912",  # Domain state machines are clearer as explicit branches.
  "PLR0913",  # Public domain APIs carry independently meaningful parameters.
  "PLR0915",  # Orchestrators remain linear to keep transactional flow visible.
  "PLR0917",  # Public domain APIs carry independently meaningful parameters.
  "PLR2004",  # Named protocol and fixture values are clearer inline at assertions.
  # PLE0704 is NOT ignored repo-wide and now has ZERO sites (#221). It once had one,
  # suppressed at the line in ablation/runner.py; that helper was changed to take the
  # exception and re-raise it explicitly, so the suppression was deleted rather than
  # moved. Any new hit is a real one -- do not silence an error-class rule globally.
  "PLW0603",  # Module caches require explicit global assignment at narrow seams.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S",
  "B017",  # Broad exception assertions intentionally cover validator and adapter boundaries.
  "B905",  # Test-only zips compare fixtures whose equal lengths are asserted separately.
  "PLR0402",  # Module aliasing is deliberate where tests monkeypatch the module boundary.
  "PLR1714",  # Separate comparisons preserve distinct identity and exit-code assertions.
  "PLR5501",  # Nested fixture branches mirror the scenario structure under test.
  "PLW0108",  # Zero-argument lambdas are concise factories for monkeypatched dependencies.
]
"fuzz/**" = ["S", "SIM105"]

[tool.mypy]
# Analysis target 3.12: numpy >=2.5 stubs use PEP 695 `type` statements, which mypy
# rejects at parse time under python_version = 3.11 (stub-ecosystem floor moved).
# Runtime floor is 3.12 (requires-python + the CI test matrix): the pinned numerical
# stack (numpy 2.5.x / scipy 1.18.x) ships no cp311 wheels, so 3.11 was unsupportable.
python_version = "3.12"
# src-layout resolution. CI installs the package (-e ".[dev]") so `skill_harness`
# resolves there without this, but the pre-commit mypy hook runs in an isolated
# venv whose additional_dependencies list cannot contain this package itself --
# so every test file importing skill_harness failed the hook with import-not-found
# while passing an installed-env `mypy --strict` run. Adding the search path fixes
# the hook without changing what CI checks.
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
files = ["src", "tests"]

# statsmodels ships no py.typed marker or stubs; ignore missing imports (C.4 length regression)
[[tool.mypy.overrides]]
module = ["statsmodels", "statsmodels.*"]
ignore_missing_imports = true

# inspect_ai / inspect_swe are the OPTIONAL [inspect] extra (agentic subject layer);
# not installed in the default dev/CI environment, imports are lazy behind a typed error.
# follow_imports=skip keeps the modules Any even when the extra IS installed locally,
# so mypy verdicts (incl. which type:ignore comments are used) match CI deterministically.
[[tool.mypy.overrides]]
module = ["inspect_ai", "inspect_ai.*", "inspect_swe", "inspect_swe.*"]
ignore_missing_imports = true
follow_imports = "skip"

# PyYAML and jsonschema ship no stubs here and reach this environment only as
# transitive dependencies of the [inspect] extra (inspect-swe requires pyyaml,
# inspect-ai requires jsonschema). Both are imported lazily behind the extra's
# install hint, so the core package still type-checks and imports without them.
# Stub packages are deliberately not added: this repo declares no types-* deps,
# and adding one would be a supply-chain decision for a lazily imported module.
[[tool.mypy.overrides]]
module = ["yaml", "jsonschema"]
ignore_missing_imports = true
