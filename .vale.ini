StylesPath = styles
MinAlertLevel = warning

# Promotion by ticket #108 (the cross-repo Taste-promotion ticket). Five of the six Taste rows are ERROR
# here: a line that breaks one of them fails the `vale` CI job (README.md docs/), which
# no longer carries `continue-on-error` for that check -- see .github/workflows/ci.yml.
# Generic-ness STAYS warning: two hits remain in
# docs/adr/0001-architecture-admitted-on-demonstrated-decision-requirement.md, and this
# session's canonical-document guard (CLAUDE.md section 5) refuses an edit to that file
# without a human-approved plan naming it. Promoting Generic-ness here would redden CI on
# a file this pass cannot touch, so the row holds at warning until that ADR is fixed under
# its own plan.
# Dashes holds at WARNING for the same reason Generic-ness does, and the number is the
# argument. Vale counts 474 prose hits across the tracked markdown outside CHANGELOG.md,
# so promoting the row here reddens CI on files this change does not touch. The rule is
# ERROR on README.md below, which is clean today and is the surface a stranger reads.
# The source of the rule is the owner's voice card: "NO em dashes in deliverables.
# Spaced hyphen ' - ' in working notes only." Promote the row once the sweep lands.
[*]
BasedOnStyles = Taste
Taste.Brevity-and-order = error
Taste.Dressing = error
Taste.Evidence = error
Taste.Register = error
Taste.Voice = error
Taste.Dashes = warning

[README.md]
Taste.Dashes = error
