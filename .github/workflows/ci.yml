name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-ci.txt -e ".[dev]"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-ci.txt -e ".[dev]"
      - name: mypy
        # Full strict scope (src + tests) restored 2026-07-10 — repo issue #2
        # burn-down; the tests/ override relaxation of 2026-07-09 is removed.
        run: mypy --strict src/ tests/

  test:
    name: Test (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # 10 -> 15 (#56): the slow-marked full-grid frontier test pushed the
    # windows py3.13 cell to 9m20s against the old 10-minute ceiling (40s of
    # headroom); #57/#58 add more tests. Headroom, not license - if a cell
    # ever needs >15, thin the slow lane instead (#40's logged even-n
    # thinning clause), never bump blindly.
    #
    # 15 -> 25: NOT blind, and NOT suite growth. The SAME suite ran windows
    # py3.13 in 12m23s on one PR and 15m08s on another the same day - a ~23%
    # runner-variance swing that straddles the ceiling and kills passing runs.
    # The kill presents as conclusion "cancelled", indistinguishable from a
    # duplicate-run cancel until you read the job annotation ("exceeded the
    # maximum execution time"); it has now been misdiagnosed that way once.
    # Thinning the slow lane here would delete real coverage to absorb runner
    # variance, which is the wrong trade. The thinning clause above still
    # governs genuine suite growth - measure which it is before bumping again.
    # Observed windows range at this pin: 10m10s - 15m08s. The sibling
    # calibration job, which runs shorter cells, already sits at 40.
    timeout-minutes: 25
    # PYTHONHASHSEED=0 required by tests/oracles/tier1 autouse fixture for
    # A33 mechanical-validity bit-equality discipline.
    env:
      PYTHONHASHSEED: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-ci.txt -e ".[dev]"
      - name: pytest
        # `-m "not live and not calibration"` mirrors local gate; live tests require
        # ANTHROPIC_API_KEY (not provisioned in CI). Dense CS calibration (#187) runs
        # in the dedicated calibration job below — do not fold it into this 15m cell.
        run: pytest -q -m "not live and not calibration" --cov=src/skill_harness --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  calibration:
    name: Calibration CS grid (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Dense #187 grid is ~10× the #164 grid. Own job so the matrix cell's 15m
    # cap is never raised. Budget windows at 2× linux (~30m); headroom to 40.
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-ci.txt -e ".[dev]"
      - name: pytest calibration
        run: pytest -q -m calibration --tb=short

  structural-bans:
    name: Structural bans (raw sqlite3.connect / oracle_verdicts / timestamp ORDER BY)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # S5: pinned — see depersonalization-gate.yml's identical step for the
      # rationale (any future release runs immediately in this job otherwise).
      - run: python -m pip install pre-commit==4.6.0
      - name: sqlite3.connect() ban (A23 Sec.3 PRAGMA/FK discipline, PRD.md #17a)
        run: pre-commit run ban-raw-sqlite-connect --all-files
      - name: oracle_verdicts raw-access allowlist (A29, PRD.md #17)
        run: pre-commit run ban-raw-oracle-verdicts --all-files
      - name: timestamp-final ORDER BY ban (deterministic tie-break on append-only tables)
        run: pre-commit run ban-timestamp-final-order-by --all-files

  drift-check:
    name: Drift check (locked contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Declarative contract table (#43/#53): pass-rule thresholds, sampling
      # schedule, token bans, estimand vocabulary, registered claim sentences.
      # Green output prints exactly what is covered — never more (F7).
      - name: Run drift check
        run: python scripts/drift_check.py

  release-gate:
    name: Release gate (surface lockstep)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Same gate publish.yml runs before building a release artifact:
      # version lockstep, rolled CHANGELOG, README banner + PyPI render
      # safety, workflow SHA pins. Running it on every push/PR means a
      # stale surface is caught at review time, not tag time.
      - name: Run release gate
        run: python scripts/release_gate.py

  # NON-required (#184): deliberately omitted from all-green / branch-protection
  # required-check names. Fails the job on dead links in public prose; does not
  # block merge by required-status configuration.
  linkcheck:
    name: Link check (docs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Link check README + docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Remap same-repo blob/tree/main URLs onto the checked-out tree so a
          # PR that adds both a doc and a README link to it is not failed for
          # a main-branch 404 before merge. External URLs still hit the network.
          args: >-
            --verbose
            --no-progress
            --accept 200,206,429
            --remap 'https://github.com/MrBinnacle/skill-harness/blob/main/(.*) file://${{ github.workspace }}/$1'
            --remap 'https://github.com/MrBinnacle/skill-harness/tree/main/(.*) file://${{ github.workspace }}/$1'
            README.md
            "docs/**/*.md"
          fail: true

  all-green:
    name: All checks green
    needs: [lint, typecheck, test, calibration, structural-bans, drift-check, release-gate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all dependent jobs succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.calibration.result }}" != "success" ]] || \
             [[ "${{ needs.structural-bans.result }}" != "success" ]] || \
             [[ "${{ needs.drift-check.result }}" != "success" ]] || \
             [[ "${{ needs.release-gate.result }}" != "success" ]]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All checks passed."
