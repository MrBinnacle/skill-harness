<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="skill-harness — compares the same task with and without a skill and refuses unsupported scores">
  <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}</style>
  <!-- field: bench-void -->
  <rect width="1280" height="640" fill="#010409"/>
  <!-- readout frame on the 96px safe area: bench-surface, 2px bench-hairline stroke, radius 0 -->
  <rect x="96" y="96" width="1088" height="448" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <!-- wordmark: bench-muted-deep, bench-command size -->
  <text x="128" y="144" class="mono" font-size="21" fill="#6e7681">skill-harness</text>
  <!-- command line: bench-command -->
  <text x="128" y="200" class="mono" font-size="21" font-weight="700"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">skill-harness run ablation </tspan><tspan fill="#6e7681">my-skill</tspan><tspan fill="#e6edf3"> --execute</tspan></text>
  <!-- subtitle: bench-muted -->
  <text x="128" y="240" class="mono" font-size="21" fill="#8b949e">with skill vs without — same task, one variable</text>
  <!-- readout line: bench-verdict, led by the arrow in bench-flagged -->
  <text x="128" y="320" class="mono" font-size="52" font-weight="700"><tspan fill="#d29922">&#8594; CUT</tspan><tspan fill="#8b949e" font-size="21" font-weight="400"> (subsumed)</tspan></text>
  <!-- explanation: bench-ink-soft -->
  <text x="128" y="368" class="mono" font-size="21" fill="#c9d1d9">the model already does this fine without the skill.</text>
  <text x="128" y="400" class="mono" font-size="21" fill="#c9d1d9">nothing to add — and we won't invent a number.</text>
  <!-- verdict legend: bench-muted-deep (text pinned until the owner selects a line) -->
  <text x="128" y="440" class="mono" font-size="21" fill="#6e7681">KEEP · CUT · CAN'T-TELL-YET — a verdict that's allowed to say "no"</text>
  <!-- footer: bench-muted, then the URL in bench-prompt -->
  <text x="128" y="488" class="mono" font-size="21" fill="#8b949e">Most benchmarks print a number no matter what. This one refuses.</text>
  <text x="128" y="520" class="mono" font-size="21" fill="#3fb950" font-weight="700">github.com/MrBinnacle/skill-harness</text>
</svg>
