<svg xmlns="http://www.w3.org/2000/svg" width="780" height="176" viewBox="0 0 780 176" role="img" aria-label="skill-harness — the skill eval that refuses to invent a score">
  <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}</style>
  <!-- terminal window (dark interior; light border so it sits well on a light README) -->
  <rect x="1.5" y="1.5" width="777" height="173" rx="12" fill="#0d1117" stroke="#d0d7de" stroke-width="2"/>
  <!-- title bar -->
  <circle cx="28" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="28" r="6" fill="#27c93f"/>
  <text x="98" y="33" class="mono" font-size="15" fill="#6e7681">skill-harness</text>
  <line x1="0" y1="48" x2="780" y2="48" stroke="#21262d" stroke-width="1.5"/>
  <!-- command -->
  <text x="28" y="96" class="mono" font-size="21"><tspan fill="#3fb950" font-weight="700">$ </tspan><tspan fill="#e6edf3">skill-harness run ablation </tspan><tspan fill="#6e7681">SKILL.md</tspan></text>
  <!-- verdict + tagline -->
  <text x="28" y="140" class="mono" font-size="19"><tspan fill="#d29922" font-weight="700">&#8594; UNMEASURED</tspan><tspan fill="#8b949e"> — the skill eval that refuses to invent a score</tspan></text>
</svg>
