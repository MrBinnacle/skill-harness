<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150" role="img" aria-label="skill-harness — the skill eval that refuses to invent a score">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <!-- measurement glyph: paired with-vs-without comparison inside an instrument frame -->
  <g transform="translate(24,34)">
    <rect x="0" y="0" width="76" height="72" rx="7" fill="none" stroke="#e6edf3" stroke-width="3"/>
    <line x1="13" y1="56" x2="63" y2="56" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/>
    <!-- without-skill arm (baseline) -->
    <rect x="22" y="40" width="13" height="16" fill="#e6edf3"/>
    <!-- with-skill arm (measured) -->
    <rect x="42" y="24" width="13" height="32" fill="#3fb950"/>
  </g>
  <!-- wordmark -->
  <text x="128" y="74" class="mono" font-size="40" font-weight="700" fill="#e6edf3">skill-harness</text>
  <text x="128" y="106" class="mono" font-size="19" fill="#8b949e">the skill eval that <tspan fill="#3fb950">refuses to invent a score</tspan></text>
</svg>
